<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bilgehan Zeki Özaytaç · Bağlantılar</title>
<meta name="description" content="Podcast, YouTube, Instagram ve diğer bağlantılar.">
<meta property="og:title" content="Bilgehan Zeki Özaytaç · Bağlantılar">
<meta property="og:description" content="Yeni podcast: Yapay Zekâ Seni Onaylıyorsa Bu Kötü Bir Haber Olabilir">
<meta property="og:image" content="https://i.ytimg.com/vi/U6JQCnTjxUQ/hqdefault.jpg">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0d1424">
<link rel="icon" href="zeki.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1424;
    --bg-2: #141d33;
    --card: #18223b;
    --card-hover: #1f2b49;
    --line: rgba(255, 255, 255, 0.09);
    --text: #f4f1ea;
    --muted: #aab3c5;
    --amber: #ffb547;
    --amber-ink: #1c1203;
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(255, 181, 71, 0.16), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(80, 120, 200, 0.14), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    padding: calc(40px + env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom));
  }
  header { text-align: center; margin-bottom: 28px; }
  .avatar {
    width: 112px; height: 112px; border-radius: 50%;
    object-fit: cover; display: block; margin: 0 auto 16px;
    border: 3px solid var(--amber);
    box-shadow: 0 0 0 6px rgba(255, 181, 71, 0.12), 0 12px 32px rgba(0, 0, 0, 0.45);
  }
  h1 { font-size: 1.45rem; font-weight: 700; margin: 0 0 4px; letter-spacing: -0.01em; }
  .handle { color: var(--amber); font-weight: 600; font-size: 0.95rem; margin: 0 0 10px; }
  .tagline { color: var(--muted); font-size: 0.9rem; line-height: 1.55; margin: 0 auto; max-width: 30em; }

  .featured {
    display: block; text-decoration: none; color: inherit;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    overflow: hidden; margin-bottom: 22px;
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
    transition: transform .18s ease, border-color .18s ease;
  }
  .featured:hover, .featured:focus-visible { transform: translateY(-2px); border-color: rgba(255, 181, 71, 0.55); }
  .thumb { position: relative; aspect-ratio: 16 / 9; background: var(--bg-2); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .play {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: linear-gradient(180deg, transparent 45%, rgba(13, 20, 36, 0.75));
  }
  .play span {
    width: 64px; height: 64px; border-radius: 50%; background: var(--amber);
    display: grid; place-items: center; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
  }
  .play svg { width: 26px; height: 26px; margin-left: 4px; fill: var(--amber-ink); }
  .featured-body { padding: 16px 18px 18px; }
  .label {
    display: inline-block; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--amber); margin-bottom: 6px;
  }
  .featured h2 { font-size: 1.15rem; line-height: 1.35; margin: 0 0 6px; font-weight: 700; }
  .featured p { color: var(--muted); font-size: 0.9rem; line-height: 1.5; margin: 0 0 14px; }
  .cta {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--amber); color: var(--amber-ink); font-weight: 700; font-size: 0.92rem;
    padding: 10px 16px; border-radius: 999px;
  }

  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .link {
    display: flex; align-items: center; gap: 14px; min-height: 60px;
    padding: 12px 16px; border-radius: var(--radius);
    background: var(--card); border: 1px solid var(--line);
    color: var(--text); text-decoration: none;
    transition: background .18s ease, border-color .18s ease, transform .18s ease;
  }
  .link:hover, .link:focus-visible { background: var(--card-hover); border-color: rgba(255, 181, 71, 0.45); transform: translateY(-1px); }
  a:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
  .icon {
    flex: 0 0 auto; width: 38px; height: 38px; border-radius: 12px;
    background: rgba(255, 181, 71, 0.12); display: grid; place-items: center;
  }
  .glyph {
    width: 20px; height: 20px; background: var(--amber);
    -webkit-mask: var(--src) center / contain no-repeat; mask: var(--src) center / contain no-repeat;
  }
  .text { display: flex; flex-direction: column; min-width: 0; }
  .title { font-weight: 600; font-size: 1rem; }
  .subtitle { color: var(--muted); font-size: 0.82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .arrow { margin-left: auto; color: var(--muted); font-size: 1.1rem; }

  footer { text-align: center; color: var(--muted); font-size: 0.78rem; margin-top: 32px; }
  .error { color: var(--muted); text-align: center; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <header>
    <img class="avatar" id="avatar" src="zeki.jpg" alt="Bilgehan Zeki Özaytaç'ın çizgi portresi" width="112" height="112">
    <h1 id="name">Bilgehan Zeki Özaytaç</h1>
    <p class="handle" id="handle">@wildgenie</p>
    <p class="tagline" id="tagline"></p>
  </header>

  <a class="featured" id="featured" href="https://www.youtube.com/watch?v=U6JQCnTjxUQ" rel="noopener">
    <div class="thumb">
      <img id="f-img" src="https://i.ytimg.com/vi/U6JQCnTjxUQ/hqdefault.jpg" alt="" loading="eager">
      <div class="play" aria-hidden="true"><span><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></span></div>
    </div>
    <div class="featured-body">
      <span class="label" id="f-label">Podcast</span>
      <h2 id="f-title">Yapay Zekâ Seni Onaylıyorsa Bu Kötü Bir Haber Olabilir</h2>
      <p id="f-text"></p>
      <span class="cta" id="f-cta">Tam bölümü izle</span>
    </div>
  </a>

  <ul id="links" aria-label="Bağlantılar"></ul>
  <noscript><p class="error">Bağlantıları görmek için JavaScript'i açın.</p></noscript>

  <footer>wildgenie.github.io/links</footer>
</main>

<script>
  const ICONS = {
    youtube: "https://cdn.jsdelivr.net/npm/simple-icons@13.21.0/icons/youtube.svg",
    instagram: "https://cdn.jsdelivr.net/npm/simple-icons@13.21.0/icons/instagram.svg",
    linkedin: "https://cdn.jsdelivr.net/npm/simple-icons@13.21.0/icons/linkedin.svg",
    github: "https://cdn.jsdelivr.net/npm/simple-icons@13.21.0/icons/github.svg",
    x: "https://cdn.jsdelivr.net/npm/simple-icons@13.21.0/icons/x.svg",
    orcid: "https://cdn.jsdelivr.net/npm/simple-icons@13.21.0/icons/orcid.svg",
    globe: "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm7.93 9h-3.47a15.7 15.7 0 0 0-1.3-5.6A8.03 8.03 0 0 1 19.93 11ZM12 4.04c.98 1.3 1.98 3.6 2.43 6.96H9.57C10.02 7.64 11.02 5.34 12 4.04ZM8.84 5.4A15.7 15.7 0 0 0 7.54 11H4.07a8.03 8.03 0 0 1 4.77-5.6ZM4.07 13h3.47c.16 2.1.6 4.04 1.3 5.6A8.03 8.03 0 0 1 4.07 13ZM12 19.96c-.98-1.3-1.98-3.6-2.43-6.96h4.86c-.45 3.36-1.45 5.66-2.43 6.96Zm3.16-1.36c.7-1.56 1.14-3.5 1.3-5.6h3.47a8.03 8.03 0 0 1-4.77 5.6Z"/></svg>')
  };
  const $ = (id) => document.getElementById(id);
  function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text) n.textContent = text; return n; }

  fetch("links.json", { cache: "no-cache" })
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then((d) => {
      const p = d.profile || {};
      if (p.name) { $("name").textContent = p.name; document.title = p.name + " · Bağlantılar"; }
      if (p.handle) $("handle").textContent = p.handle;
      if (p.tagline) $("tagline").textContent = p.tagline;
      if (p.avatar) $("avatar").src = p.avatar;

      const f = d.featured;
      if (f) {
        $("featured").href = f.url;
        if (f.image) $("f-img").src = f.image;
        $("f-label").textContent = f.label || "";
        $("f-title").textContent = f.title || "";
        $("f-text").textContent = f.text || "";
        $("f-cta").textContent = f.cta || "İzle";
      } else {
        $("featured").remove();
      }

      const ul = $("links");
      (d.links || []).forEach((l) => {
        const li = el("li");
        const a = el("a", "link");
        a.href = l.url; a.rel = "noopener";
        const ic = el("span", "icon"); const g = el("span", "glyph");
        g.style.setProperty("--src", `url("${ICONS[l.icon] || ICONS.globe}")`);
        ic.appendChild(g); a.appendChild(ic);
        const t = el("span", "text");
        t.appendChild(el("span", "title", l.title));
        if (l.subtitle) t.appendChild(el("span", "subtitle", l.subtitle));
        a.appendChild(t);
        a.appendChild(el("span", "arrow", "↗")).setAttribute("aria-hidden", "true");
        li.appendChild(a); ul.appendChild(li);
      });
    })
    .catch(() => {
      $("links").replaceWith(el("p", "error", "Bağlantılar yüklenemedi. Sayfayı yenileyin."));
    });
</script>
</body>
</html>
